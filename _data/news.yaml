- body: '<img src="/img/news/2026-03-31-abdulla-jasem-almansoori-defends-phd-thesis.png"
    align="middle" width="600"><br/> My PhD student Abdulla Jasem Almansoori defended
    his thesis, Adapters for Collaborative Learning: Personalization and Structure-Aware
    Optimization.<br/><br/>His dissertation studies parameter-efficient adaptation
    for collaborative learning, focusing on federated learning under heterogeneous
    client data and structure-aware optimization of lightweight adapters. The committee
    included Samuel Horvath, Praneeth Vepakomma, Martin Jaggi, and me.'
  date: '2026-03-31'
  title: Abdulla Jasem Almansoori Defends PhD Thesis
- body: <img src="/img/news/2026-02-26-byzantine-robust-federated-learning.jpg" align="middle"
    width="600"><br/> MBZUAI featured our work on Bant, a Byzantine-robust approach
    to federated learning. The method combines a trusted trial function with trust
    scores to filter corrupted updates, with variants evaluated on image classification,
    ECG abnormality detection, and recommender system benchmarks.<br/><br/>The study
    was presented orally at the 40th Annual AAAI Conference on Artificial Intelligence
    in Singapore, with co-authors from MBZUAI and other institutions, including me.
    --- <a href="https://mbzuai.ac.ae/news/the-search-for-an-antidote-to-byzantine-attacks/">check
    the full article here</a>.
  date: '2026-02-26'
  title: Byzantine-Robust Federated Learning
- body: <img src="/img/news/2025-12-17-artem-agafonov-defended-his-phd-thesis.jpg"
    align="middle" width="500"><br/> My PhD student Artem Agafonov defended his PhD
    thesis, "Globally Convergent Quasi-Newton-Type Methods and Their Applications
    in Convex Minimization, Federated Learning and Variational Inequalities."<br/><br/>The
    committee members were Martin Takac, Samuel Horvath, Zhiqiang Shen, Junpei Komiyama,
    and Sebastian Stich.
  date: '2025-12-17'
  title: Artem Agafonov Defended His PhD Thesis
- body: <img src="/img/news/2025-09-29-mednns-for-medical-imaging-model-selection.jpg"
    align="middle" width="500"><br/> An MBZUAI news article describes MedNNS, a framework
    for selecting both neural network architectures and pretrained weights for new
    medical imaging datasets. The approach reframes model selection as a retrieval
    problem, using dataset and model embeddings to recommend candidates before expensive
    training begins.<br/><br/>The article notes that MedNNS is planned for presentation
    at MICCAI 2025 in South Korea and reports gains in speed, accuracy, and stability
    across MedMNIST tasks, while also discussing limitations for out-of-distribution
    datasets and future directions beyond classification. --- <a href="https://mbzuai.ac.ae/news/how-mednns-picks-the-right-ai-model-for-each-type-of-hospital-scan/">check
    the full article here</a>.
  date: '2025-09-29'
  title: MedNNS for Medical Imaging Model Selection
- body: <img src="/img/news/2025-07-28-recall-and-the-reversal-curse-in-llms.jpg"
    align="middle" width="600"><br/> I co-authored a study on ReCall, a two-step prompting
    strategy that uses self-referencing causal cycles in text to help autoregressive
    language models retrieve information across sequence order.<br/><br/>The work
    examines the reversal curse in LLMs and will be presented at the 63rd Annual Meeting
    of the Association for Computational Linguistics in Vienna. --- <a href="https://mbzuai.ac.ae/news/overcoming-the-reversal-curse-in-llms-with-recall/">check
    the full article here</a>.
  date: '2025-07-28'
  title: ReCall and the reversal curse in LLMs
- body: <img src="/img/news/2024-10-28-first-mbzuai-phd-student-defense.jpg" align="middle"
    width="600"><br/> On October 28, 2024, my first PhD student at MBZUAI defended
    his thesis, Machine Learning for Combinatorial Optimization. The committee included
    Larry Snyder, Karthik Nandakumar, Bin Gu, Zhiqiang Xu, and me.<br/><br/>The thesis
    examined machine learning approaches for combinatorial optimization, including
    reinforcement learning for stochastic vehicle routing and scheduling, curriculum
    learning, and prompting strategies for large language models.
  date: '2024-10-28'
  title: First MBZUAI PhD Student Defense
- body: I gave a keynote, "Beyond Conventional Boundaries, RL's Leap in Solving Optimization
    Problems," at the AAAI 2024 Workshop on Artificial Intelligence for Operations
    Research in Vancouver, Canada. --- <a href="https://ai-or.github.io/2024/">AAAI
    2024 Workshop on Artificial Intelligence for Operations Research</a>.
  date: '2024-02-26'
  title: Keynote at AAAI 2024 Workshop on Artificial Intelligence for Operations Research
- body: <img src="/img/news/2021-05-05-moving-to-mbzuai.jpg" align="middle" width="600"><br/>
    I am excited to share that starting in Fall 2021 I will move to MBZUAI in Abu
    Dhabi, UAE. I am grateful to my colleagues at Lehigh, from where I moved, for
    their support.<br/><br/>I have multiple openings in my research lab for those
    interested in joining me. --- <a href="https://mbzuai.ac.ae">www.MBZUAI.ac.ae</a>.
  date: '2021-05-05'
  title: Moving to MBZUAI

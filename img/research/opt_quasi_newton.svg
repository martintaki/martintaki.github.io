<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive cubic quasi-Newton diagram</title>
  <desc id="desc">Low-cost curvature pairs build a quasi-Newton approximation, which feeds an adaptive cubic regularized step.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0752b8"/>
    </marker>
    <style>
      .bg{fill:#fbf6ec}.panel{fill:#fff;stroke:#d8c39a;stroke-width:2}.flow{stroke:#0752b8;stroke-width:4;fill:none;marker-end:url(#arrow)}.mat{fill:#0752b8}.mat2{fill:#0f8f8a}.mat3{fill:#c9a15b}.curve{fill:none;stroke:#25344a;stroke-width:4}.reg{fill:none;stroke:#c9a15b;stroke-width:5;stroke-dasharray:10 7}.label{fill:#18263a;font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:800}.small{font-size:15px;font-weight:700}.muted{fill:#5b6778}
    </style>
  </defs>
  <rect class="bg" width="720" height="360"/>
  <rect x="36" y="64" width="186" height="224" rx="16" class="panel"/>
  <text x="64" y="99" class="label small">curvature pairs</text>
  <g transform="translate(75 126)">
    <rect x="0" y="0" width="38" height="28" rx="6" class="mat"/>
    <rect x="54" y="0" width="38" height="28" rx="6" class="mat2"/>
    <text x="11" y="20" fill="#fff" class="small">s</text>
    <text x="66" y="20" fill="#fff" class="small">y</text>
    <rect x="0" y="54" width="38" height="28" rx="6" class="mat"/>
    <rect x="54" y="54" width="38" height="28" rx="6" class="mat2"/>
    <rect x="0" y="108" width="38" height="28" rx="6" class="mat"/>
    <rect x="54" y="108" width="38" height="28" rx="6" class="mat2"/>
  </g>
  <path d="M232 176 C265 176 272 176 304 176" class="flow"/>
  <rect x="314" y="50" width="168" height="250" rx="16" class="panel"/>
  <text x="344" y="86" class="label small">quasi-Newton</text>
  <text x="366" y="108" class="small muted">Hessian model</text>
  <g transform="translate(346 132)">
    <rect x="0" y="0" width="26" height="26" class="mat"/>
    <rect x="30" y="0" width="26" height="26" class="mat2"/>
    <rect x="60" y="0" width="26" height="26" class="mat"/>
    <rect x="90" y="0" width="26" height="26" class="mat3"/>
    <rect x="0" y="30" width="26" height="26" class="mat2"/>
    <rect x="30" y="30" width="26" height="26" class="mat"/>
    <rect x="60" y="30" width="26" height="26" class="mat3"/>
    <rect x="90" y="30" width="26" height="26" class="mat2"/>
    <rect x="0" y="60" width="26" height="26" class="mat"/>
    <rect x="30" y="60" width="26" height="26" class="mat3"/>
    <rect x="60" y="60" width="26" height="26" class="mat2"/>
    <rect x="90" y="60" width="26" height="26" class="mat"/>
    <rect x="0" y="90" width="26" height="26" class="mat3"/>
    <rect x="30" y="90" width="26" height="26" class="mat2"/>
    <rect x="60" y="90" width="26" height="26" class="mat"/>
    <rect x="90" y="90" width="26" height="26" class="mat2"/>
  </g>
  <path d="M493 176 C522 176 529 176 558 176" class="flow"/>
  <rect x="566" y="74" width="116" height="204" rx="16" class="panel"/>
  <text x="594" y="105" class="label small">cubic</text>
  <text x="588" y="126" class="small muted">regularizer</text>
  <path d="M590 242 C605 172 631 138 660 113" class="curve"/>
  <path d="M586 243 C623 228 651 201 672 150" class="reg"/>
  <circle cx="612" cy="196" r="9" fill="#c9a15b"/>
</svg>

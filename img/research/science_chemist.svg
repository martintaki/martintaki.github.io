<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">CHEMIST heterogeneous embedding diagram</title>
  <desc id="desc">A molecular graph and token sequence are fused into a joint chemistry embedding used for prediction.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0752b8"/>
    </marker>
    <style>
      .bg{fill:#fbf6ec}.panel{fill:#fff;stroke:#d8c39a;stroke-width:2}.bond{stroke:#5d7597;stroke-width:5}.flow{stroke:#0752b8;stroke-width:4;fill:none;marker-end:url(#arrow)}.atom{fill:#fff;stroke:#0752b8;stroke-width:5}.atom2{stroke:#0f8f8a}.atom3{stroke:#c9a15b}.tok{fill:#0752b8}.tok2{fill:#0f8f8a}.tok3{fill:#c9a15b}.label{fill:#18263a;font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:800}.small{font-size:15px;font-weight:700}.muted{fill:#5b6778}
    </style>
  </defs>
  <rect class="bg" width="720" height="360"/>
  <rect x="36" y="45" width="220" height="270" rx="16" class="panel"/>
  <text x="72" y="82" class="label">molecular graph</text>
  <line x1="108" y1="155" x2="166" y2="115" class="bond"/>
  <line x1="166" y1="115" x2="218" y2="158" class="bond"/>
  <line x1="218" y1="158" x2="193" y2="222" class="bond"/>
  <line x1="193" y1="222" x2="118" y2="220" class="bond"/>
  <line x1="118" y1="220" x2="108" y2="155" class="bond"/>
  <circle cx="108" cy="155" r="22" class="atom"/>
  <circle cx="166" cy="115" r="22" class="atom atom2"/>
  <circle cx="218" cy="158" r="22" class="atom atom3"/>
  <circle cx="193" cy="222" r="22" class="atom"/>
  <circle cx="118" cy="220" r="22" class="atom atom2"/>
  <text x="101" y="162" class="small muted">C</text>
  <text x="159" y="122" class="small muted">O</text>
  <text x="211" y="165" class="small muted">N</text>
  <rect x="36" y="326" width="220" height="0" fill="none"/>
  <rect x="300" y="67" width="154" height="88" rx="14" class="panel"/>
  <text x="332" y="101" class="label small">tokens</text>
  <rect x="324" y="116" width="28" height="18" rx="5" class="tok"/>
  <rect x="360" y="116" width="28" height="18" rx="5" class="tok2"/>
  <rect x="396" y="116" width="28" height="18" rx="5" class="tok3"/>
  <path d="M258 178 C292 178 295 132 326 132" class="flow"/>
  <path d="M454 132 C493 132 493 178 532 178" class="flow"/>
  <path d="M258 178 C330 242 455 242 532 178" class="flow"/>
  <rect x="542" y="83" width="134" height="190" rx="18" class="panel"/>
  <text x="572" y="119" class="label small">joint</text>
  <text x="550" y="141" class="label small">embedding</text>
  <g transform="translate(571 167)">
    <rect x="0" y="0" width="18" height="70" rx="6" class="tok"/>
    <rect x="26" y="18" width="18" height="52" rx="6" class="tok2"/>
    <rect x="52" y="7" width="18" height="63" rx="6" class="tok3"/>
    <rect x="78" y="30" width="18" height="40" rx="6" class="tok"/>
  </g>
</svg>

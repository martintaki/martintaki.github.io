<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">LoFT low-rank adaptation diagram</title>
  <desc id="desc">Full fine-tuning dynamics are approximated by low-rank adapters with projected optimizer moments.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0752b8"/>
    </marker>
    <style>
      .bg{fill:#fbf6ec}.panel{fill:#fff;stroke:#d8c39a;stroke-width:2}.flow{stroke:#0752b8;stroke-width:4;fill:none;marker-end:url(#arrow)}.full{fill:#0752b8}.low{fill:#0f8f8a}.gold{fill:#c9a15b}.ghost{fill:#dbe6f5}.label{fill:#18263a;font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:800}.small{font-size:15px;font-weight:700}.muted{fill:#5b6778}
    </style>
  </defs>
  <rect class="bg" width="720" height="360"/>
  <rect x="44" y="58" width="222" height="244" rx="16" class="panel"/>
  <text x="78" y="95" class="label small">full fine-tuning</text>
  <g transform="translate(84 126)">
    <rect x="0" y="0" width="26" height="26" class="full"/>
    <rect x="30" y="0" width="26" height="26" class="full"/>
    <rect x="60" y="0" width="26" height="26" class="full"/>
    <rect x="90" y="0" width="26" height="26" class="full"/>
    <rect x="0" y="30" width="26" height="26" class="full"/>
    <rect x="30" y="30" width="26" height="26" class="ghost"/>
    <rect x="60" y="30" width="26" height="26" class="full"/>
    <rect x="90" y="30" width="26" height="26" class="ghost"/>
    <rect x="0" y="60" width="26" height="26" class="full"/>
    <rect x="30" y="60" width="26" height="26" class="full"/>
    <rect x="60" y="60" width="26" height="26" class="ghost"/>
    <rect x="90" y="60" width="26" height="26" class="full"/>
    <rect x="0" y="90" width="26" height="26" class="ghost"/>
    <rect x="30" y="90" width="26" height="26" class="full"/>
    <rect x="60" y="90" width="26" height="26" class="full"/>
    <rect x="90" y="90" width="26" height="26" class="full"/>
  </g>
  <path d="M274 180 C315 180 322 180 362 180" class="flow"/>
  <rect x="372" y="58" width="132" height="244" rx="16" class="panel"/>
  <text x="399" y="95" class="label small">LoFT</text>
  <rect x="412" y="128" width="18" height="108" rx="6" class="low"/>
  <rect x="440" y="128" width="18" height="108" rx="6" class="low"/>
  <rect x="392" y="164" width="94" height="16" rx="6" class="gold"/>
  <rect x="392" y="194" width="94" height="16" rx="6" class="full"/>
  <text x="386" y="264" class="small muted">low-rank update</text>
  <path d="M512 180 C545 180 553 180 586 180" class="flow"/>
  <rect x="596" y="96" width="88" height="168" rx="16" class="panel"/>
  <text x="614" y="132" class="small muted">Adam</text>
  <text x="611" y="154" class="small muted">moments</text>
  <circle cx="640" cy="192" r="26" fill="#0752b8"/>
  <text x="626" y="199" fill="#fff" class="small">proj</text>
</svg>

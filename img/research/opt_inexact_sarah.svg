<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Inexact SARAH mini-batch gradient diagram</title>
  <desc id="desc">Inexact SARAH replaces exact outer gradients with sufficiently large mini-batch estimates while preserving variance reduction.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0752b8"/>
    </marker>
    <style>
      .bg{fill:#fbf6ec}.panel{fill:#fff;stroke:#d8c39a;stroke-width:2}.flow{stroke:#0752b8;stroke-width:4;fill:none;marker-end:url(#arrow)}.mini{fill:#0752b8}.mini2{fill:#0f8f8a}.mini3{fill:#c9a15b}.band{fill:#fff;stroke:#0f8f8a;stroke-width:4}.label{fill:#18263a;font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:800}.small{font-size:15px;font-weight:700}.muted{fill:#5b6778}
    </style>
  </defs>
  <rect class="bg" width="720" height="360"/>
  <rect x="44" y="68" width="178" height="224" rx="18" class="panel"/>
  <text x="80" y="106" class="label small">mini-batch</text>
  <rect x="82" y="138" width="28" height="28" rx="6" class="mini"/>
  <rect x="118" y="138" width="28" height="28" rx="6" class="mini2"/>
  <rect x="154" y="138" width="28" height="28" rx="6" class="mini3"/>
  <rect x="100" y="182" width="28" height="28" rx="6" class="mini3"/>
  <rect x="136" y="182" width="28" height="28" rx="6" class="mini"/>
  <text x="78" y="250" class="small muted">outer estimate</text>
  <path d="M230 180 C264 180 272 180 306 180" class="flow"/>
  <rect x="316" y="78" width="154" height="204" rx="18" class="panel"/>
  <text x="354" y="115" class="label small">inexact</text>
  <text x="346" y="139" class="small muted">gradient anchor</text>
  <rect x="354" y="174" width="78" height="40" rx="20" class="band"/>
  <text x="371" y="200" class="small muted">v_0</text>
  <path d="M480 180 C514 180 522 180 556 180" class="flow"/>
  <rect x="566" y="88" width="110" height="184" rx="18" fill="#0752b8"/>
  <text x="590" y="129" class="small" fill="#fff">general</text>
  <text x="586" y="153" class="small" fill="#fff">stochastic</text>
  <text x="590" y="198" class="small" fill="#fff">best-known</text>
  <text x="592" y="222" class="small" fill="#fff">complexity</text>
</svg>
